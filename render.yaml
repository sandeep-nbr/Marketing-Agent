services:
  - type: web
    name: aria-marketing-agent
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ARIA_MODEL
        value: claude-sonnet-5
      - key: NODE_VERSION
        value: 22.22.2
